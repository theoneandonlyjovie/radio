name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build signed APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Publish to the "app" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk MyRadio.apk
          gh release delete app --yes --cleanup-tag || true
          gh release create app MyRadio.apk \
            --title "My Radio (build ${{ github.run_number }})" \
            --notes "Download MyRadio.apk on your phone and open it to install or update." \
            --latest
